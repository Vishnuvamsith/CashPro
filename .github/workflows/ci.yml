name: CashPro CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'
            cache: maven
      - name: Build and test all Maven modules
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify test report totals
        run: |
          totals=$(find payment-service/target/surefire-reports approval-service/target/surefire-reports payment-processing-service/target/surefire-reports -name 'TEST-*.xml' -type f -exec grep -h '<testsuite ' {} + | sed -E 's/.* tests="([0-9]+)".*errors="([0-9]+)".*failures="([0-9]+)".*/\1 \2 \3/' | awk '{ tests += $1; errors += $2; failures += $3 } END { print tests, errors, failures }')
          set -- $totals
          test "$1" -gt 0
          test "$2" -eq 0
          test "$3" -eq 0
      - name: Build payment-service image
        run: docker build --file payment-service/Dockerfile --tag cashpro/payment-service:${GITHUB_SHA} .
      - name: Build payment-processing-service image
        run: docker build --file payment-processing-service/Dockerfile --tag cashpro/payment-processing-service:${GITHUB_SHA} .
      - name: Build approval-service image
        run: docker build --file approval-service/Dockerfile --tag cashpro/approval-service:${GITHUB_SHA} .
