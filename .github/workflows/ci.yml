name: CashPro CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
            distribution: 'temurin'
            java-version: '17'
            cache: maven
      - name: Build and test all Maven modules
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify test report totals
        run: |
          totals=$(find payment-service/target/surefire-reports approval-service/target/surefire-reports payment-processing-service/target/surefire-reports -name 'TEST-*.xml' -type f -exec grep -h '<testsuite ' {} + | sed -E 's/.* tests="([0-9]+)".*errors="([0-9]+)".*failures="([0-9]+)".*/\1 \2 \3/' | awk '{ tests += $1; errors += $2; failures += $3 } END { print tests, errors, failures }')
          set -- $totals
          test "$1" -gt 0
          test "$2" -eq 0
          test "$3" -eq 0
      - name: Upload tested service JARs
        uses: actions/upload-artifact@v4
        with:
          name: cashpro-service-jars
          path: |
            payment-service/target/*.jar
            payment-processing-service/target/*.jar
            approval-service/target/*.jar
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - payment-processing-service
          - approval-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tested service JARs
        uses: actions/download-artifact@v4
        with:
          name: cashpro-service-jars
          path: .

      - name: Verify tested JARs are present
        run: |
          test -n "$(find payment-service/target -maxdepth 1 -name '*.jar' -type f -print -quit)"
          test -n "$(find payment-processing-service/target -maxdepth 1 -name '*.jar' -type f -print -quit)"
          test -n "$(find approval-service/target -maxdepth 1 -name '*.jar' -type f -print -quit)"

      - name: Prepare lowercase GHCR namespace
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/cashpro-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify published image can be pulled
        env:
          IMAGE: ghcr.io/${{ steps.image.outputs.owner }}/cashpro-${{ matrix.service }}
        run: docker pull "$IMAGE:${GITHUB_SHA}"
