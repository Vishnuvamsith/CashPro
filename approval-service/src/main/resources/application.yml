server:
  port: 8082
spring:
  application:
    name: approval-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/cashpro}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: approval
    open-in-view: false
  flyway:
    enabled: true
    schemas: approval
    default-schema: approval
    create-schemas: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9095}
    properties:
      schema.registry.url: ${SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL:http://localhost:8088}
    consumer:
      group-id: approval-service-requests
      auto-offset-reset: earliest
      properties:
        specific.avro.reader: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
cashpro:
  approval:
    authorized-approvers: ${APPROVAL_AUTHORIZED_USERS:omRaut}
    thresholds:
      USD: 1000.00
      EUR: 900.00
      GBP: 800.00
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
