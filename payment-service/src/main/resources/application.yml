server:
  port: 8080
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:55432/cashpro
    username: cashpro
    password: cashpro
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092,localhost:9095
    properties:
      schema.registry.url: http://localhost:8088
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
