apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "\\[[^,]+,([0-9a-f]{32}),[0-9a-f]{16}\\]"
          datasourceUid: tempo
          url: "$${__value.raw}"
