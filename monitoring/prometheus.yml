global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'payment-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8080']

  - job_name: 'payment-processing-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-processing-service:8081']

  - job_name: 'approval-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['approval-service:8082']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']