services:
  postgres:
    image: postgres:16
    container_name: cashpro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for the local stack}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for the local stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local stack}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cashpro-redis
    ports:
      - "6379:6379"

  controller:
    image: confluentinc/cp-kafka:7.9.0
    hostname: controller
    container_name: cashpro-controller
    ports:
      - "9093:9093"
    environment:
      CLUSTER_ID: '1234'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://controller:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - controller_data:/var/lib/kafka/data

  broker1:
    image: confluentinc/cp-kafka:7.9.0
    hostname: broker1
    container_name: cashpro-broker1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: '1234'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1_data:/var/lib/kafka/data

  broker2:
    image: confluentinc/cp-kafka:7.9.0
    hostname: broker2
    container_name: cashpro-broker2
    ports:
      - "9095:9095"
    environment:
      CLUSTER_ID: '1234'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29095,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:29095,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2_data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    hostname: schema-registry
    container_name: cashpro-schema-registry
    depends_on:
      - broker1
      - broker2
    ports:
      - "8088:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker1:29092,PLAINTEXT://broker2:29095
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: cashpro-kafka-exporter
    depends_on:
      - broker1
      - broker2
    command:
      - --kafka.server=broker1:29092
      - --kafka.server=broker2:29095
      - --kafka.version=3.9.0
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:latest
    container_name: cashpro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml

  grafana:
    image: grafana/grafana:latest
    container_name: cashpro-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER for the local stack}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD for the local stack}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards/cashpro:ro

  payment-service:
    profiles: [apps]
    image: cashpro/payment-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    depends_on:
      - postgres
      - redis
      - broker1
      - broker2
      - schema-registry
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cashpro
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER for the local stack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local stack}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29095
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PAYMENT_APPROVAL_THRESHOLD_USD: ${PAYMENT_APPROVAL_THRESHOLD_USD:-1000.00}

  payment-processing-service:
    profiles: [apps]
    image: cashpro/payment-processing-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: payment-processing-service/Dockerfile
    depends_on:
      payment-service:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started
      broker1:
        condition: service_started
      broker2:
        condition: service_started
      schema-registry:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cashpro
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER for the local stack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local stack}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29095
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  approval-service:
    profiles: [apps]
    image: cashpro/approval-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: approval-service/Dockerfile
    depends_on:
      - postgres
      - broker1
      - broker2
      - schema-registry
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cashpro
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER for the local stack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local stack}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29095
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      APPROVAL_AUTHORIZED_USERS: ${APPROVAL_AUTHORIZED_USERS:-}

volumes:
  postgres_data:
  controller_data:
  kafka1_data:
  kafka2_data: